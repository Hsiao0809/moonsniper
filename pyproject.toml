[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moon-sniper-improved"
version = "0.1.0"
description = "Auditable paper-trading validation and review layer for Moon Sniper."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hermes / hsiao0809"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
